# =====================================================================
# 数据库连接配置（A 维护 · 全组唯一的连接信息入口）
#
# 规则：
#   1) 本文件位于 src/main/resources/，打包后进入 classpath 根目录；
#   2) 换机器/换账号只改这里，禁止把地址、账号、密码写进任何 Java 文件；
#   3) 文件编码必须是 UTF-8（否则中文注释会乱码，但不影响连接）；
#   4) 演示机/答辩机可用 -Dbri.db.config=D:\path\db.properties 指定外部配置覆盖本文件；
#   5) 库名必须与 sql/01_schema.sql 中的 CREATE DATABASE 一致：bri_pm。
# =====================================================================

# JDBC 驱动类名（MySQL 8 固定为 com.mysql.cj.jdbc.Driver，老版本 com.mysql.jdbc.Driver 已废弃）
jdbc.driver=com.mysql.cj.jdbc.Driver

# 连接串参数说明：
#   useUnicode + characterEncoding=utf8  中文不乱码
#   serverTimezone=Asia/Shanghai         不设会报 "The server time zone value ... is unrecognized"
#   useSSL=false                         本机演示不需要证书握手
#   allowPublicKeyRetrieval=true         MySQL 8 caching_sha2_password 首次连接需要
#   rewriteBatchedStatements=true        批量插入时提速（种子数据脚本导入相关操作用得上）
jdbc.url=jdbc:mysql://127.0.0.1:3306/bri_pm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true

# 本机 MySQL 账号密码：改成你自己的
jdbc.username=root
jdbc.password=Za131374
